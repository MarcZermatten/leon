[package]
name = "leon"
version = "1.0.10"
description = "Léon - Claude Code UI Wrapper"
authors = ["Marc Zermatten"]
license = "MIT"
repository = "https://github.com/MarcZermatten/leon"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "leon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
image = "0.25"
portable-pty = "0.9.0"
uuid = { version = "1.19.0", features = ["v4"] }
tauri-plugin-dialog = "2.4.2"
chrono = "0.4"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory"
] }
